<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm your email</title>
    <style>
        .button {
            display: inline-block;
            padding: 12px 24px;
            background-color: #4F46E5;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f3f4f6; font-family: Arial, Helvetica, sans-serif;">
<table role="presentation"
       style="width: 100%; max-width: 600px; margin: 0 auto; background-color: #ffffff; border-collapse: collapse; border-spacing: 0;">
    <tr>
        <td style="padding: 32px 24px; text-align: center; background-color: #4F46E5;">
            <h1 style="color: #ffffff; margin: 0; font-size: 24px;">Flashcards App</h1>
        </td>
    </tr>
    <tr>
        <td style="padding: 32px 24px;">
            <p style="font-size: 18px; color: #374151; margin: 0 0 16px 0;">
                Hello, <strong th:text="${username}">user</strong>
            </p>
            <p style="font-size: 16px; color: #6b7280; margin: 0 0 24px 0;">
                Thank you for signing up! Please confirm your email address by clicking the button below.
            </p>
            <p style="text-align: center; margin: 0 0 24px 0;">
                <a th:href="${verificationUrl}" class="button">Confirm Email Address</a>
            </p>
            <p style="font-size: 14px; color: #9ca3af; margin: 0;">
                If you did not create an account with Flashcards App, please ignore this email.
            </p>
        </td>
    </tr>
    <tr>
        <td style="padding: 16px 24px; text-align: center; border-top: 1px solid #e5e7eb;">
            <p style="font-size: 12px; color: #9ca3af; margin: 0;">Flashcards App — 2026</p>
        </td>
    </tr>
</table>
</body>
</html>
